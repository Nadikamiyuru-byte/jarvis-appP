name: Build Jarvis APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Flutter project
        run: flutter create --org com.nexgen --project-name jarvis --platforms android app
      - name: Add code, packages, Android settings
        working-directory: app
        run: |
          cp ../src/main.dart lib/main.dart
          flutter pub add flutter_foreground_task:^8.0.0 porcupine_flutter:^3.0.0 speech_to_text:^7.0.0 flutter_tts:^4.2.0 http:^1.2.0 permission_handler:^11.3.0 shared_preferences:^2.3.0
          python3 ../tools/patch_android.py
      - name: Build APK
        working-directory: app
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
